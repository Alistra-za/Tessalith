[package]
name = "modscan"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
thiserror.workspace = true
nif = { path = "../nif", features = ["serde"] }
vfs = { path = "../vfs" }
rusqlite.workspace = true
rayon.workspace = true
serde_json.workspace = true
crc32fast.workspace = true
esp = { path = "../esp" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Diagnostics_ToolHelp", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_System_Com"] }

[features]
# Test-only seams (DECISIONS Note GJ). Off by default and never enabled by a release build; the dev-dependency below
# turns it on for `cargo test` (resolver 2 keeps dev-dependency features out of `cargo build`).
test-hooks = []

[dev-dependencies]
tempfile.workspace = true
modscan = { path = ".", features = ["test-hooks"] }

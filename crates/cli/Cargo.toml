[package]
name = "sdc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "sdc"
path = "src/main.rs"

[dependencies]
engine.workspace = true
encoders-sys.workspace = true
clap.workspace = true
ctrlc.workspace = true
serde_json.workspace = true
tempfile.workspace = true
image.workspace = true
modscan = { path = "../modscan" }
nif = { path = "../nif" }
vfs = { path = "../vfs" }

[features]
# Forwards to the engine's env-driven test hooks. Off by default; `cargo test` enables the engine feature through
# the dev-dependency below, so this one is only for building a hook-enabled `sdc` by hand.
test-hooks = ["engine/test-hooks"]

[dev-dependencies]
engine = { workspace = true, features = ["test-hooks"] }
# test-hooks only so `cargo test -p sdc` builds the same sdc-gui, modscan, pgpsim and render3d as the workspace run
# (no test here reads a GUI hook).
sdc-gui = { path = "../gui", features = ["test-hooks"] }

[package]
name = "encoders-sys"
version.workspace = true
edition.workspace = true
license.workspace = true # Tessalith's own files; vendor/ keeps its own licences (THIRD_PARTY_NOTICES.md)
publish.workspace = true
rust-version.workspace = true
build = "build.rs"
links = "sdc_encoders"

[dependencies]
thiserror.workspace = true

[build-dependencies]
cc.workspace = true

[features]
# Caps `ispc_target()` at AVX2, so tests encode on one ISPC path on every CPU; `SDC_TEST_AVX512=1` lifts the cap.
# Off by default and never enabled by a release build; the dev-dependency below turns it on for `cargo test`,
# examples and benches (resolver 2 keeps dev-dependency features out of `cargo build`). DECISIONS Notes K and HZ.
test-hooks = []

[dev-dependencies]
encoders-sys = { path = ".", features = ["test-hooks"] }
sha2.workspace = true
hex.workspace = true
bcdec_rs.workspace = true
half.workspace = true
image.workspace = true
bcenc.workspace = true

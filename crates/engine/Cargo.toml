[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
encoders-sys.workspace = true
# The BC1, BC3, BC4 and BC5 block encoders (Note HY7).
bcenc.workspace = true
texcore = { workspace = true, features = ["load"] }
serde.workspace = true
# float_roundtrip: a cached Analysis must read back bit for bit (Note DZ).
serde_json = { workspace = true, features = ["float_roundtrip"] }
toml.workspace = true
schemars.workspace = true
thiserror.workspace = true
image.workspace = true
half.workspace = true
bcdec_rs.workspace = true
rayon.workspace = true
sha2.workspace = true
hex.workspace = true
globset.workspace = true
walkdir.workspace = true
humantime.workspace = true
# The analysis cache's thumbnails are stored deflated (Note HV); already in the lock through esp.
flate2.workspace = true

[features]
# Env-driven test hooks (SDC_TEST_PANIC_ON, SDC_TEST_PANIC_ON_PLAN, SDC_TEST_FAIL_VALIDATION, SDC_TEST_CANCEL_ON, SDC_TEST_ENCODE_INPUT_DIR) and the encoders' AVX2 cap. Off by default and never enabled by a
# release build; the dev-dependency below turns it on for `cargo test` (resolver 2 keeps dev-dependency
# features out of `cargo build`). DECISIONS Notes K and HZ.
test-hooks = ["encoders-sys/test-hooks"]

[dev-dependencies]
tempfile.workspace = true
engine = { path = ".", features = ["test-hooks"] }

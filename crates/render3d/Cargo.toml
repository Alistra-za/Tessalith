[package]
name = "render3d"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
nif = { path = "../nif" }
half = { workspace = true }
texcore = { workspace = true }
windows = { version = "0.62.2", features = ["Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D_Fxc", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_Threading"] }

[features]
# Test-only seams (DECISIONS Note GJ). Off by default and never enabled by a release build; the dev-dependency below
# turns it on for `cargo test` (resolver 2 keeps dev-dependency features out of `cargo build`).
test-hooks = []

[dev-dependencies]
modscan = { path = "../modscan" }
vfs = { path = "../vfs" }
tempfile = { workspace = true }
texcore = { workspace = true, features = ["load"] }
image = { workspace = true }
render3d = { path = ".", features = ["test-hooks"] }

[package]
name = "bcenc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "rgbcx's block encoders in Rust (port of bc7enc_rdo commit b943862 with Tessalith's patches)"

# No dependencies: the C++ in encoders-sys is the reference, used by the tests only.
[dev-dependencies]
encoders-sys.workspace = true
# The corpus tests (tests/corpus.rs) read PNGs and compare images in parallel.
image.workspace = true
rayon.workspace = true

# The quality tool's unit tests run with `cargo test -p bcenc` (plan D adds its verdict tests there).
[[example]]
name = "quality"
test = true

# The speed tool's argument parsing is tested the same way; `cargo test --workspace` (the gate) runs both.
[[example]]
name = "speed"
test = true

[lints]
workspace = true

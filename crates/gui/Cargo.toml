[package]
name = "sdc-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# eframe 0.36.2's floor.
rust-version.workspace = true
# Note HU1: the test files are modules of one binary, `tests/it/main.rs`. Only the targets listed below are built.
autotests = false

[lib]
name = "sdc_gui"
path = "src/lib.rs"

[[bin]]
name = "tessalith"
path = "src/main.rs"

[[test]]
name = "it"
path = "tests/it/main.rs"

# Each file below changes process-wide state, so it stays a process of its own (Note HU2).
# These six point %LOCALAPPDATA% or %APPDATA% at a temp folder.
[[test]]
name = "app_no_local_store"
path = "tests/app_no_local_store.rs"

[[test]]
name = "doc_shots"
path = "tests/doc_shots.rs"

[[test]]
name = "meshes_header"
path = "tests/meshes_header.rs"

[[test]]
name = "nif_edit"
path = "tests/nif_edit.rs"

[[test]]
name = "replan_timing"
path = "tests/replan_timing.rs"

[[test]]
name = "ui_proof"
path = "tests/ui_proof.rs"

# Installs the panic hook.
[[test]]
name = "crash_recovery"
path = "tests/crash_recovery.rs"

# Sets the device-lost flag, which nothing clears: the next `SdcApp` frame in the process would open the restart
# dialog, wait for a click, then start the test exe again and exit.
[[test]]
name = "device_lost"
path = "tests/device_lost.rs"

[[test]]
name = "ui_drive"
path = "tests/ui_drive/main.rs"
harness = false

[dependencies]
engine.workspace = true
encoders-sys.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
half.workspace = true
# Default features minus default_fonts (system fonts are loaded at run time, see fonts.rs). wgpu is used only through eframe::egui_wgpu::wgpu. No "links": the GUI never opens a URL (Explorer actions spawn explorer.exe, AG34), so a future ui.hyperlink would do nothing.
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "wgpu"] }
rfd = "=0.17.2"
toml_edit = "0.25"
sha2.workspace = true
hex.workspace = true
modscan = { path = "../modscan" }
# MATO preview (Note GG): one record's DATA read from its plugin.
esp = { path = "../esp" }
nif = { path = "../nif", features = ["serde"] }
render3d = { path = "../render3d" }
vfs = { path = "../vfs" }
pgpsim = { path = "../pgpsim" }
rusqlite.workspace = true
# F3b: find/replace patterns in the rename dialog (linear time, no look-around).
regex = "1"
# Item 12 Copy image: already in the lock through egui-winit, with the same features.
arboard = { version = "=3.6.1", default-features = false, features = ["image-data"] }
# Item 22: source image sizes from the file header only.
image.workspace = true

# The monitor rectangles at start (layout.rs, AG18) and the cursor at a file drop (ui::drop_pos, AG98). 0.61.2 is the
# version eframe's winit already uses.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation"] }

[features]
# Test seams and the counters they read (DECISIONS Notes FM27 and GJ2). Off by default and never enabled by a release
# build; the dev-dependency below turns it on for `cargo test` and `--all-targets` (resolver 2 keeps dev-dependency
# features out of `cargo build`). The engine does the same. It forwards the NIF-side crates' own seams and the encoders'
# AVX2 cap.
test-hooks = ["render3d/test-hooks", "modscan/test-hooks", "pgpsim/test-hooks", "encoders-sys/test-hooks"]

[dev-dependencies]
sdc-gui = { path = ".", features = ["test-hooks"] }
egui_kittest = { version = "=0.36.2", features = ["wgpu"] }
tempfile.workspace = true
walkdir.workspace = true
crc32fast.workspace = true

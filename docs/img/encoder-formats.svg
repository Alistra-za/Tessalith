<text x="10.0" y="894.0" class="s" text-anchor="start">Tessalith's rgbcx is patched: BC1 endpoints scored on both the NVIDIA and AMD decoders, and a wider BC4 block search.</text>
<text x="10.0" y="910.0" class="s" text-anchor="start">BC3 to BC5 are decoded rounding to nearest, as GPUs do. The full table is in the wiki (Research).</text>
<text x="10.0" y="926.0" class="s" text-anchor="start">† Original 4 HDRIs only; Compressonator's mPSNR there was 1.2 dB below ISPC.</text>

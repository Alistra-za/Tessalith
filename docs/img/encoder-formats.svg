<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 936" width="780" height="936" role="img" aria-labelledby="t d">
<title id="t">Encoders compared by format, PSNR</title>
<desc id="d">Bar chart of PSNR in dB, grouped by format (BC1 on the NVIDIA and AMD decoders, BC3 smooth and cutout alpha, BC4, BC5 RG, BC6H multi-exposure), one bar per encoder, with the encoder shown by colour and stripe pattern. Tessalith's patched rgbcx is best on BC1 (39.51 NVIDIA, 39.75 AMD), BC3 (49.50 premultiplied, 50.30 cutout alpha) and BC4 (49.10), and ties NVTT 3 on BC5 (47.16). NVTT 3 is second on most formats. Intel ISPC is best on BC6H (50.38). rgbcx and Compressonator BC6H values were not measured. The Tessalith default encoder per format (rgbcx for BC1 to BC5, Intel ISPC for BC6H) has an outline and a bold label.</desc>
<style>
svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
--ink:#1f2328;--mute:#59636e;--grid:#d1d9e0;--bg:#ffffff;--c0:#2a78d6;--c1:#eb6834;--c2:#1baf7a;--c3:#6250d6;--c4:#e87ba4;}
@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--mute:#9198a1;--grid:#30363d;--bg:#0d1117;--c0:#3987e5;--c1:#d95926;--c2:#199e70;--c3:#9085e9;--c4:#d55181;}}
.bg{fill:var(--bg)}
text{fill:var(--ink);font-size:12px;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.m{fill:var(--mute)}
.b{font-weight:600}
.t{font-size:14px;font-weight:600}
.s{font-size:11px;fill:var(--mute)}
.g{stroke:var(--grid);stroke-width:1;fill:none}
.z{stroke:var(--mute);stroke-width:1;fill:none}
.lt{opacity:.5}
.mu{fill:var(--mute)}
.pl{fill:var(--bg)}
.nf{fill:var(--mute)}
.df{fill:none;stroke:var(--ink);stroke-width:2}
.f0{fill:var(--c0)}.f1{fill:var(--c1)}.f2{fill:var(--c2)}.f3{fill:var(--c3)}.f4{fill:var(--c4)}</style>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 936" width="780" height="936" role="img" aria-labelledby="t d">
<title id="t">Encoders compared by format, PSNR against Tessalith</title>
<desc id="d">Bar chart grouped by format (BC1 on the NVIDIA and AMD decoders, BC3 smooth and cutout alpha, BC4, BC5 RG, BC6H multi-exposure). Each bar is an encoder's PSNR difference in dB from Tessalith's default encoder for that format, which is 0; bars to the left are worse. Each format uses its own images, so bars compare only within a format. Tessalith's patched rgbcx is best on BC1, BC3 and BC4; NVTT 3 is closest, 0.08 to 1.17 dB behind, and ties it on BC5. The largest gap is ISPC on BC3 cutout alpha, 4.57 dB behind. On BC6H, Tessalith's Intel ISPC leads NVTT 3 by 2.38 dB and texconv by 0.76 dB. rgbcx has no BC6H encoder, and Compressonator's BC6H was not measured on these images.</desc>
<style>
svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
--ink:#1f2328;--mute:#59636e;--grid:#d1d9e0;--bg:#ffffff;--c0:#2a78d6;--c1:#eb6834;--c2:#1baf7a;--c3:#6250d6;--c4:#e87ba4;}
@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--mute:#9198a1;--grid:#30363d;--bg:#0d1117;--c0:#3987e5;--c1:#d95926;--c2:#199e70;--c3:#9085e9;--c4:#d55181;}}
.bg{fill:var(--bg)}
text{fill:var(--ink);font-size:12px;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.m{fill:var(--mute)}
.b{font-weight:600}
.t{font-size:14px;font-weight:600}
.s{font-size:11px;fill:var(--mute)}
.g{stroke:var(--grid);stroke-width:1;fill:none}
.z{stroke:var(--mute);stroke-width:1;fill:none}
.lt{opacity:.5}
.mu{fill:var(--mute)}
.df{fill:none;stroke:var(--ink);stroke-width:2}
.f0{fill:var(--c0)}.f1{fill:var(--c1)}.f2{fill:var(--c2)}.f3{fill:var(--c3)}.f4{fill:var(--c4)}</style>

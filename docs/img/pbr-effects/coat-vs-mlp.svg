<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#222">
  <title>Vanilla multilayer parallax puts your diffuse on top and the inner layer under it; a CS True PBR coat puts the coat on top of your albedo</title>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
  </defs>
  <rect width="760" height="400" rx="10" fill="#ffffff"/>
  <line x1="380" y1="20" x2="380" y2="380" stroke="#d5d9de"/>

  <!-- Vanilla multilayer parallax -->
  <text x="190" y="32" text-anchor="middle" font-weight="600" font-size="15">Vanilla multilayer parallax</text>
  <circle cx="50" cy="70" r="9" fill="none" stroke="#222" stroke-width="2"/><circle cx="50" cy="70" r="3" fill="#222"/>
  <text x="50" y="98" text-anchor="middle" font-size="12">view</text>
  <!-- top layer with a see-through window -->
  <rect x="30" y="140" width="110" height="16" fill="#d9b98c" stroke="#8a6d3f"/>
  <rect x="180" y="140" width="80" height="16" fill="#d9b98c" stroke="#8a6d3f"/>
  <rect x="140" y="140" width="40" height="16" fill="#d9b98c" fill-opacity="0.25" stroke="#8a6d3f" stroke-dasharray="4 3"/>
  <text x="270" y="146" font-size="12" font-weight="600">TOP: your diffuse</text>
  <text x="270" y="161" font-size="12">+ _n, env map</text>
  <text x="160" y="132" text-anchor="middle" font-size="11" fill="#6b5d3c">alpha low</text>
  <!-- gap -->
  <line x1="24" y1="158" x2="24" y2="238" stroke="#777" marker-start="url(#h)" marker-end="url(#h)"/>
  <text x="16" y="198" font-size="11" fill="#555" transform="rotate(-90 16 198)" text-anchor="middle">inner thickness</text>
  <!-- inner layer -->
  <rect x="30" y="240" width="230" height="16" fill="#9a7fc0" stroke="#5c4785"/>
  <text x="270" y="246" font-size="12" font-weight="600">UNDER: _i</text>
  <text x="270" y="261" font-size="12">inner layer</text>
  <!-- view ray -->
  <polyline points="58,78 160,148 214,240" fill="none" stroke="#2c6fd0" stroke-width="2.5" marker-end="url(#h)"/>
  <line x1="160" y1="148" x2="160" y2="240" stroke="#2c6fd0" stroke-dasharray="3 3"/>
  <text x="187" y="275" text-anchor="middle" font-size="11" fill="#2c56b0">shifted with view angle</text>
  <text x="190" y="320" text-anchor="middle">Your diffuse is the top layer.</text>
  <text x="190" y="338" text-anchor="middle">The extra map, _i, is seen below it</text>
  <text x="190" y="356" text-anchor="middle">where the diffuse alpha is low.</text>

  <!-- CS True PBR coat -->
  <text x="570" y="32" text-anchor="middle" font-weight="600" font-size="15">CS True PBR coat</text>
  <circle cx="430" cy="70" r="9" fill="none" stroke="#222" stroke-width="2"/><circle cx="430" cy="70" r="3" fill="#222"/>
  <text x="430" y="98" text-anchor="middle" font-size="12">view</text>
  <!-- coat on top -->
  <rect x="410" y="140" width="230" height="14" fill="#cfe6f7" stroke="#4f8fc4"/>
  <text x="648" y="146" font-size="12" font-weight="600">TOP: coat</text>
  <text x="648" y="161" font-size="12">_s, _cnr</text>
  <!-- base under it -->
  <rect x="410" y="154" width="230" height="70" fill="#c98b6b" stroke="#7d4f37"/>
  <text x="648" y="186" font-size="12" font-weight="600">UNDER: your</text>
  <text x="648" y="201" font-size="12">albedo, _n,</text>
  <text x="648" y="216" font-size="12">_rmaos</text>
  <!-- rays -->
  <line x1="438" y1="78" x2="525" y2="140" stroke="#2c6fd0" stroke-width="2.5"/>
  <line x1="525" y1="140" x2="600" y2="86" stroke="#4f8fc4" stroke-width="2.5" marker-end="url(#h)"/>
  <text x="606" y="80" font-size="11" fill="#2f6a9c">coat reflection</text>
  <line x1="525" y1="140" x2="548" y2="190" stroke="#2c6fd0" stroke-width="2.5" marker-end="url(#h)"/>
  <text x="556" y="246" text-anchor="middle" font-size="11" fill="#7d4f37">base colour and reflection,</text>
  <text x="556" y="260" text-anchor="middle" font-size="11" fill="#7d4f37">dimmed by the coat</text>
  <text x="570" y="320" text-anchor="middle">Your albedo is the bottom layer.</text>
  <text x="570" y="338" text-anchor="middle">The extra map, _s, describes the clear</text>
  <text x="570" y="356" text-anchor="middle">or tinted layer on top of it.</text>
</svg>

schema_version = 1
id = "sdc-base"
version = "2.0.0"
hidden = true
description = "Per-sub-type defaults from spec §4.1/§4.2. Not selectable; every preset inherits it."

[defaults]
color = { content = "linear", tag = "unorm" }
alpha = { policy = "remove", threshold = 127, compare = "gt", exact_opaque = false }
channels = { flip_green = false, reconstruct_z = false, grayscale_source = "r" }
mips = { levels = "full", filter = "box", normal = "renormalize", normal_base = "renormalize", bake_clamp = 0.25, coverage = "auto" }
format = "bc7"
header = "auto"
encoder = { effort = "veryslow", perceptual = false, bc45_search_radius = "default" }
packing = { enabled = true, roughness_default = 0.5, prefer = "prepacked" }

[subtypes.diffuse]
color = { content = "srgb", tag = "unorm" }
[subtypes.landscape_diffuse]
color = { content = "srgb", tag = "unorm" }
alpha = { policy = "data" }
[subtypes.pbr_albedo]
color = { content = "srgb", tag = "srgb" }
[subtypes.pbr_emissive]
color = { content = "srgb", tag = "n/a" }
format = "bc6h_uf16"
[subtypes.glow]
color = { content = "srgb", tag = "unorm" }
[subtypes.pbr_subsurface]
color = { content = "srgb", tag = "srgb" }
alpha = { policy = "data" }
[subtypes.pbr_fuzz]
color = { content = "srgb", tag = "srgb" }
alpha = { policy = "data" }
[subtypes.subsurface_tint]
color = { content = "srgb", tag = "unorm" }
[subtypes.backlight_tint]
color = { content = "srgb", tag = "unorm" }
[subtypes.ui_sky]
color = { content = "srgb", tag = "unorm" }
mips = { levels = "none" }
[subtypes.normal]
alpha = { policy = "data" }
[subtypes.landscape_normal]
alpha = { policy = "data" }
[subtypes.pbr_normal]
alpha = { policy = "remove" }
[subtypes.msn]
alpha = { policy = "remove" }
[subtypes.coat_normal]
alpha = { policy = "data" }
mips = { normal = "renormalize_bake" }
[subtypes.envmask]
alpha = { policy = "remove", exact_opaque = true }
format = "bc4"
[subtypes.complex_material]
alpha = { policy = "data", exact_opaque = true }
[subtypes.rmaos]
alpha = { policy = "data" }
[subtypes.skin_rfaos]
alpha = { policy = "data" }
[subtypes.flow]
format = "bc5"
[subtypes.height]
format = "bc4"
resize_floor = 256
[subtypes.projected_noise]
format = "bc4"
# A hand-picked grey map: BC4 or R8, red channel (Note FM37). Colour, alpha and channels are the defaults above.
[subtypes.gray]
format = "bc4"
[subtypes.detail_normal]
alpha = { policy = "data" }
[subtypes.msn_specular]
format = "bc4"
[subtypes.generic_two_channel]
format = "bc5"
[subtypes.generic_data]
alpha = { policy = "data" }
[subtypes.hdr_sky]
color = { content = "linear", tag = "n/a" }
format = "bc6h_uf16"
# Advanced skin (DECISIONS Note R-skin-1). Albedo is UNORM, not sRGB: the CS skin shader reads it that way.
[subtypes.skin_albedo]
color = { content = "srgb", tag = "unorm" }
# _sk keeps only the red channel.
[subtypes.skin_sk]
format = "bc4"
# _wet is a normal with a binary mask in alpha (BC7). CS no longer reads a grey one, so that is not written.
[subtypes.skin_wet]
alpha = { policy = "data" }
# A detail map is BC5 when its alpha is opaque, else BC7 (the fact is set in policy.rs).
[subtypes.skin_detail]
alpha = { policy = "data" }
# A cubemap is gamma-encoded colour written UNORM (CS decodes it from game gamma).
[subtypes.cubemap]
color = { content = "srgb", tag = "unorm" }

[[rules]]
match = { glob = "**/interface/**" }
overrides = { mips = { levels = "none" } }

[[rules]]
match = { glob = "**/sky/**" }
overrides = { mips = { levels = "none" } }

name: Release build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # A tag whose RELEASE-NOTES.md is still a draft or another version's fails here, before the build.
      - name: Release notes match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: ./tools/release-notes.ps1 -Version ('${{ github.ref_name }}'.TrimStart('v')) -Out "$env:RUNNER_TEMP/notes.md"
      # Installs the channel, target and components pinned in rust-toolchain.toml.
      - name: Install toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Builds sdc-gui and sdc in release for the triple in .cargo/config, then writes
      # dist/Tessalith-<version>-win-x64.zip and dist/SHA256SUMS.txt. No ISPC needed: encoders are vendored.
      - name: Build and package
        run: tools/package-release.ps1
        shell: pwsh
      # The zip is what SignPath would sign. A SignPath submit step would go here, after this upload.
      - uses: actions/upload-artifact@v4
        with:
          name: tessalith-win-x64
          path: |
            dist/Tessalith-*-win-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  # Owner 2026-11-20: every v* tag uploads the zip to Nexus as a new version of file 8217615 on
  # skyrimspecialedition mod 196495 (v3 mod id 7318624468879 = game 1704 << 32 | 196495), archives the old
  # version, sets the mod version and posts RELEASE-NOTES.md as its changelog (owner 2026-11-23; the long
  # CHANGELOG.md is linked from the notes' last line). The API key is the secret NEXUSMODS_API_KEY of the "nexus"
  # deployment environment; the owner sets it, never the workflow.
  nexus:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: nexus
      url: https://www.nexusmods.com/skyrimspecialedition/mods/196495?tab=files
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            RELEASE-NOTES.md
            tools/release-notes.ps1
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: tessalith-win-x64
          path: dist
      - name: Version, zip and release notes
        id: rel
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $zip = Get-ChildItem dist -Filter "Tessalith-$version-win-x64.zip" | Select-Object -First 1
          if (-not $zip) { throw "dist/Tessalith-$version-win-x64.zip is missing: the tag and the workspace version differ" }
          # Fails unless RELEASE-NOTES.md is headed "## <version>".
          ./tools/release-notes.ps1 -Version $version -Out notes.md
          $notes = (Get-Content notes.md -Raw -Encoding utf8).Trim()
          $eof = "EOF$([guid]::NewGuid().ToString('N'))"
          "version=$version" >> $env:GITHUB_OUTPUT
          "zip=$($zip.FullName)" >> $env:GITHUB_OUTPUT
          "changelog<<$eof`n$notes`n$eof" >> $env:GITHUB_OUTPUT
      # Pinned to the commit of tag v1.0.0-beta.11.
      - name: Upload to Nexus Mods
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: 8217615
          mod_id: 7318624468879
          filename: ${{ steps.rel.outputs.zip }}
          version: ${{ steps.rel.outputs.version }}
          display_name: Tessalith ${{ steps.rel.outputs.version }}
          category: main
          archive_existing_version: true
          update_mod_version: true
          changelog: ${{ steps.rel.outputs.changelog }}

  # Owner 2026-11-23: every v* tag also drafts the GitHub release, with RELEASE-NOTES.md as its body and the zip and
  # SHA256SUMS.txt attached. It stays a draft: the owner reads it and presses Publish. A release that already exists
  # for the tag is left as it is.
  github:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            RELEASE-NOTES.md
            tools/release-notes.ps1
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: tessalith-win-x64
          path: dist
      - name: Draft the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          $zip = "dist/Tessalith-$version-win-x64.zip"
          if (-not (Test-Path $zip)) { throw "$zip is missing: the tag and the workspace version differ" }
          ./tools/release-notes.ps1 -Version $version -Out notes.md
          gh release view $tag -R '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "::notice::A GitHub release for $tag already exists; it was left as it is."
            exit 0
          }
          gh release create $tag -R '${{ github.repository }}' --draft --verify-tag --title "Tessalith $version" `
            --notes-file notes.md $zip dist/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)" }
